<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flavor · home kitchen</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f7f3ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .order-card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background-color: #ffffffec;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 2px 10px 0 rgba(0,0,0,0.08);
      padding: 2.2rem 2rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .brand h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(145deg, #c44b4b, #b13e3e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-right: auto;
    }
    .brand span {
      background: #2b2b2b;
      color: #f9d77e;
      padding: 0.35rem 1rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: inset 0 -1px 0 #ffffff20;
    }

    .user-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2.2rem;
    }
    .input-field {
      background: #f9f6f2;
      border: 1.5px solid transparent;
      transition: 0.15s;
      border-radius: 24px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 450;
      color: #1f1f1f;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .input-field:focus {
      border-color: #d17a4b;
      background: #ffffff;
      box-shadow: 0 8px 18px -10px #d17a4b60;
    }
    .input-field::placeholder {
      color: #aa9f96;
      font-weight: 350;
      opacity: 0.8;
    }

    .menu-section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 1.8rem 0 0.8rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #3e2e25;
      border-bottom: 2px dashed #e7cfb8;
      padding-bottom: 0.5rem;
    }
    .menu-section-title i {
      color: #b95b3f;
      font-size: 1.3rem;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffffd1;
      border-radius: 60px;
      padding: 0.35rem 0.35rem 0.35rem 1.5rem;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px -5px rgba(84, 51, 34, 0.1);
      border: 1px solid #f3e5da;
      transition: all 0.2s;
    }
    .item-row:hover {
      background: white;
      border-color: #f0cbb7;
      box-shadow: 0 10px 22px -14px #b95b3f80;
    }

    .item-info {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .item-name {
      font-weight: 620;
      font-size: 1.1rem;
      color: #2d231e;
      letter-spacing: -0.2px;
    }
    .item-price {
      background: #f8eee7;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ac4e2f;
      border: 1px solid #ffe7da;
    }

    .qty-module {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      background: #f2eae3;
      border-radius: 40px;
      padding: 0.2rem;
    }
    .qty-btn {
      background: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 40px;
      font-size: 1.5rem;
      font-weight: 500;
      color: #ac4e2f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      border: 1px solid #fadbcb;
    }
    .qty-btn:hover:not(:disabled) {
      background: #ac4e2f;
      color: white;
      border-color: #ac4e2f;
    }
    .qty-btn:disabled {
      opacity: 0.3;
      background: #e3d7cf;
      border-color: #cdbcb0;
      cursor: not-allowed;
    }
    .qty-number {
      min-width: 32px;
      text-align: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: #3e2e25;
    }

    /* button group – submit & cancel */
    .action-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .action-button {
      flex: 1 1 auto;
      background: linear-gradient(115deg, #c44b4b, #e07c4c);
      border: none;
      padding: 1.2rem 1.8rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 650;
      color: white;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 15px 25px -12px #c44b4baa;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .action-button:hover:not(:disabled) {
      background: linear-gradient(115deg, #b33e3e, #d66f42);
      transform: scale(1.01);
      box-shadow: 0 22px 30px -14px #b14242;
    }
    .action-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #bbb0a8;
      box-shadow: none;
    }

    /* cancel button alternate style */
    .cancel-btn {
      background: #f0e2da;
      color: #723b28;
      box-shadow: 0 12px 20px -14px #ac4e2f;
      border: 1px solid #eacbbe;
    }
    .cancel-btn:hover:not(:disabled) {
      background: #e2d1c7;
      color: #4f2c1e;
      box-shadow: 0 12px 22px -10px #8b5a48;
    }

    .summary-box {
      margin-top: 1.8rem;
      background: #fcf8f4;
      border-radius: 28px;
      padding: 1.3rem 1.8rem;
      border-left: 8px solid #d8997b;
      color: #2f2a27;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.6;
      white-space: pre-line;
      box-shadow: inset 0 1px 5px #ffefe3;
      border: 1px solid #ffdecb;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 10, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .loading-card {
      background: #fffcf7;
      padding: 2.2rem 2.8rem;
      border-radius: 80px 80px 60px 60px;
      text-align: center;
      box-shadow: 0 45px 70px -15px #271a12;
      border: 1px solid #ffcdb0;
    }
    .custom-spinner {
      width: 56px;
      height: 56px;
      border: 5px solid #f1cdbc;
      border-top: 5px solid #c44b4b;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 1) infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-card p {
      font-size: 1.2rem;
      font-weight: 600;
      color: #6b3f2b;
    }

    .notification {
      position: fixed;
      top: 28px;
      right: 28px;
      padding: 14px 32px;
      border-radius: 60px;
      background: #2b2b2b;
      color: white;
      font-weight: 550;
      font-size: 1rem;
      box-shadow: 0 16px 30px -10px black;
      z-index: 1000;
      backdrop-filter: blur(10px);
      border: 1px solid #ffffff50;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideFresh 0.3s ease-out;
    }
    .notification.success { background: #1f7a4d; }
    .notification.error { background: #b34238; }
    @keyframes slideFresh {
      0% { opacity: 0; transform: translateX(40px) scale(0.9); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    .footer-note {
      display: flex;
      justify-content: flex-end;
      font-size: 0.8rem;
      color: #8e796c;
      margin-top: 0.5rem;
      gap: 0.5rem;
    }

    @media (max-width: 550px) {
      .order-card { padding: 1.5rem; }
      .brand h1 { font-size: 2rem; }
      .user-grid { grid-template-columns: 1fr; }
      .item-row { flex-wrap: wrap; border-radius: 30px; gap: 5px; }
      .item-info { width: 100%; justify-content: space-between; }
      .action-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="order-card">
    <div class="brand">
      <h1><i class="fas fa-utensils" style="color: #c44b4b;"></i> flavor</h1>
      <span><i class="far fa-clock"></i> 30‑40 min</span>
    </div>

    <div class="user-grid">
      <input type="text" id="customer-name" class="input-field" placeholder="your name *" autocomplete="off">
      <input type="tel" id="customer-phone" class="input-field" placeholder="phone number *" autocomplete="off">
    </div>

    <div id="menu-container" class="items-container"></div>

    <!-- button group: submit + cancel side by side -->
    <div class="action-group">
      <button class="action-button" id="submit-btn" disabled>
        <i class="fas fa-paper-plane"></i> submit
      </button>
      <button class="action-button cancel-btn" id="cancel-btn">
        <i class="fas fa-trash-alt"></i> cancel order
      </button>
    </div>

    <div id="order-summary" class="summary-box"></div>
    <div class="footer-note">
      <i class="fas fa-leaf"></i> fresh ingredients
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-card">
      <div class="custom-spinner"></div>
      <p><i class="fas fa-mug-hot"></i> cooking order ...</p>
    </div>
  </div>

  <script>
    (function() {
      // ---------- PRODUCTS (exactly same as original) ----------
      const sandwiches = [
        {name:"Burger", price:5}, {name:"Cheese Burger", price:6}, {name:"Chicken Burger", price:6},
        {name:"Double Burger", price:8}, {name:"Veggie Burger", price:5}, {name:"Fish Sandwich", price:6},
        {name:"Grilled Chicken Sandwich", price:7}, {name:"Spicy Chicken Sandwich", price:7},
        {name:"Bacon Burger", price:7}, {name:"Mushroom Burger", price:6}, {name:"BBQ Burger", price:8},
        {name:"Tuna Sandwich", price:6}, {name:"Egg Sandwich", price:4}, {name:"Club Sandwich", price:7},
        {name:"Ham Sandwich", price:6}, {name:"Salami Sandwich", price:6}, {name:"Turkey Sandwich", price:7},
        {name:"BLT Sandwich", price:6}, {name:"Cheesesteak Sandwich", price:8}, {name:"Pulled Pork Sandwich", price:8}
      ];
      const drinks = [
        {name:"Coca Cola", price:2}, {name:"Pepsi", price:2}, {name:"Sprite", price:2}, {name:"7 Up", price:2},
        {name:"Fanta Orange", price:2}, {name:"Fanta Lemon", price:2}, {name:"Mountain Dew", price:3},
        {name:"Dr Pepper", price:3}, {name:"Root Beer", price:3}, {name:"Iced Tea", price:2},
        {name:"Lemonade", price:2}, {name:"Water", price:1}, {name:"Red Bull", price:4}, {name:"Monster", price:4},
        {name:"Ginger Ale", price:2}, {name:"Soda Water", price:1}, {name:"Apple Juice", price:2},
        {name:"Orange Juice", price:2}, {name:"Tomato Juice", price:2}, {name:"Mango Juice", price:3}
      ];
      const dishes = [
        {name:"Chicken Nuggets", price:5}, {name:"French Fries", price:3}, {name:"Mozzarella Sticks", price:4},
        {name:"Chicken Wings", price:6}, {name:"Grilled Chicken", price:8}, {name:"Beef Steak", price:10},
        {name:"Pasta Bolognese", price:7}, {name:"Spaghetti Carbonara", price:7}, {name:"Salmon Fillet", price:9},
        {name:"Fish & Chips", price:8}, {name:"Shrimp Tempura", price:9}, {name:"Pizza Margherita", price:6},
        {name:"Pepperoni Pizza", price:7}, {name:"Vegetable Pizza", price:6}, {name:"Lasagna", price:7},
        {name:"Taco Plate", price:6}, {name:"Burrito", price:7}, {name:"Nachos", price:5}, {name:"Fried Rice", price:6},
        {name:"Chicken Curry", price:7}, {name:"Beef Burger Plate", price:8}, {name:"Veggie Plate", price:7},
        {name:"Mixed Grill", price:12}, {name:"Kebab Plate", price:10}, {name:"Sushi Set", price:12},
        {name:"Ramen Bowl", price:9}, {name:"Pad Thai", price:8}, {name:"BBQ Ribs", price:12},
        {name:"Caesar Salad", price:5}, {name:"Greek Salad", price:5}
      ];

      const menuContainer = document.getElementById('menu-container');

      function createSection(title, items, iconClass) {
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'menu-section-title';
        sectionDiv.innerHTML = `<i class="fas ${iconClass}"></i> ${title}`;
        menuContainer.appendChild(sectionDiv);

        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'item-row';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'item-info';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'item-name';
          nameSpan.innerText = item.name;
          const priceSpan = document.createElement('span');
          priceSpan.className = 'item-price';
          priceSpan.innerText = `$${item.price}`;
          infoDiv.appendChild(nameSpan);
          infoDiv.appendChild(priceSpan);

          const qtyDiv = document.createElement('div');
          qtyDiv.className = 'qty-module';
          qtyDiv.dataset.item = item.name;
          qtyDiv.dataset.price = item.price;

          const minusBtn = document.createElement('button');
          minusBtn.className = 'qty-btn minus';
          minusBtn.innerText = '–';
          minusBtn.disabled = true;

          const qtySpan = document.createElement('span');
          qtySpan.className = 'qty-number';
          qtySpan.innerText = '0';

          const plusBtn = document.createElement('button');
          plusBtn.className = 'qty-btn plus';
          plusBtn.innerText = '+';

          qtyDiv.appendChild(minusBtn);
          qtyDiv.appendChild(qtySpan);
          qtyDiv.appendChild(plusBtn);

          row.appendChild(infoDiv);
          row.appendChild(qtyDiv);
          menuContainer.appendChild(row);

          plusBtn.addEventListener('click', () => {
            let val = parseInt(qtySpan.innerText, 10);
            val++;
            qtySpan.innerText = val;
            minusBtn.disabled = (val === 0);
          });

          minusBtn.addEventListener('click', () => {
            let val = parseInt(qtySpan.innerText, 10);
            if (val > 0) {
              val--;
              qtySpan.innerText = val;
              minusBtn.disabled = (val === 0);
            }
          });
        });
      }

      createSection('sandwiches', sandwiches, 'fa-burger');
      createSection('drinks', drinks, 'fa-wine-bottle');
      createSection('main dishes', dishes, 'fa-utensil-spoon');

      // ---------- form references & validation ----------
      const nameInput = document.getElementById('customer-name');
      const phoneInput = document.getElementById('customer-phone');
      const submitBtn = document.getElementById('submit-btn');
      const cancelBtn = document.getElementById('cancel-btn');

      function validateForm() {
        phoneInput.value = phoneInput.value.replace(/\D/g, '');
        submitBtn.disabled = !(nameInput.value.trim() && phoneInput.value.trim());
      }
      nameInput.addEventListener('input', validateForm);
      phoneInput.addEventListener('input', validateForm);

      // ---------- UI utilities ----------
      const loadingOverlay = document.getElementById('loadingOverlay');
      const orderSummaryDiv = document.getElementById('order-summary');

      function showNotification(msg, type = 'success') {
        const notif = document.createElement('div');
        notif.className = `notification ${type}`;
        notif.innerHTML = `<i class="fas ${type==='success'? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3200);
      }

      // ---------- n8n webhook (same URL) ----------
      async function sendOrderToN8n(orderData) {
        const webhookUrl = 'https://alaeddineamamra.app.n8n.cloud/webhook-test/65d971e0-13f4-44b6-9eaf-1e0fffb390f2';
        try {
          const resp = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          return { success: true, data };
        } catch (err) {
          console.error(err);
          return { success: false, error: err.message };
        }
      }

      // ---------- reset / cancel function (clears everything) ----------
      function resetAllFields() {
        // clear name and phone
        nameInput.value = '';
        phoneInput.value = '';
        validateForm(); // this also disables submit

        // reset all quantity modules to 0 and disable minus buttons
        document.querySelectorAll('.qty-module').forEach(container => {
          const qtySpan = container.querySelector('.qty-number');
          const minus = container.querySelector('.minus');
          qtySpan.innerText = '0';
          minus.disabled = true;
        });

        // clear the summary box
        orderSummaryDiv.innerText = '';

        // optional small notification (but we can keep it silent, or add a subtle one)
        // I'll add a brief notification to inform user
        showNotification('🧹 order canceled', 'success');
      }

      // ---------- cancel button event ----------
      cancelBtn.addEventListener('click', function() {
        resetAllFields();
      });

      // ---------- submit logic (identical to original, but uses resetAllFields on success) ----------
      submitBtn.addEventListener('click', async function(e) {
        const customerName = nameInput.value.trim();
        const customerPhone = phoneInput.value.trim();

        if (!customerName || !customerPhone) {
          showNotification('name & phone required', 'error');
          return;
        }

        let total = 0;
        let hasItems = false;
        const orderItems = [];
        let summaryText = `🧑 ${customerName}  ·  📞 ${customerPhone}\n\n▪️ order ▪️\n`;

        document.querySelectorAll('.qty-module').forEach(container => {
          const itemName = container.dataset.item;
          const price = parseFloat(container.dataset.price);
          const qty = parseInt(container.querySelector('.qty-number').innerText, 10);
          if (qty > 0) {
            const subtotal = price * qty;
            summaryText += `  • ${itemName} x${qty}  = $${subtotal.toFixed(2)}\n`;
            total += subtotal;
            hasItems = true;
            orderItems.push({ name: itemName, quantity: qty, price, subtotal });
          }
        });

        if (!hasItems) {
          showNotification('choose at least one item', 'error');
          return;
        }

        summaryText += `\n└─ total  $${total.toFixed(2)}`;
        orderSummaryDiv.innerText = summaryText;

        const payload = {
          orderId: 'ORD-' + Date.now(),
          timestamp: new Date().toISOString(),
          customer: { name: customerName, phone: customerPhone },
          items: orderItems,
          total: Number(total.toFixed(2)),
          summary: summaryText
        };

        loadingOverlay.style.display = 'flex';
        submitBtn.disabled = true;
        cancelBtn.disabled = true;   // disable cancel during submission to avoid race

        const result = await sendOrderToN8n(payload);

        loadingOverlay.style.display = 'none';
        cancelBtn.disabled = false;  // re-enable cancel

        if (result.success) {
          showNotification('✅ order placed!', 'success');
          resetAllFields();  // clear everything after successful order
        } else {
          showNotification('❌ sending failed, try again', 'error');
          submitBtn.disabled = false;  // allow retry
          validateForm(); // maintain validation state
        }
      });

      // initial validation
      validateForm();
    })();
  </script>
</body>
</html>
