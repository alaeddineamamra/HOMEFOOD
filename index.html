<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>flavor · ingredient studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f7f3ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .order-card {
      max-width: 1400px;
      width: 100%;
      background: #ffffffec;
      backdrop-filter: blur(2px);
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      padding: 2rem 1.8rem;
      border: 1px solid rgba(245, 222, 205, 0.7);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .brand h1 {
      font-size: 2.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c44b4b, #b95b3f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-right: auto;
      letter-spacing: -0.02em;
    }
    .brand span {
      background: #2b2b2b;
      color: #f9d77e;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .user-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .input-field {
      background: #f9f6f2;
      border: 1.5px solid #eee2d8;
      border-radius: 34px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    .input-field:focus {
      border-color: #d17a4b;
      background: white;
    }

    .search-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
      background: #fefaf6;
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #f0e1d4;
    }
    .search-box {
      flex: 2;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border-radius: 44px;
      padding: 0.5rem 1rem;
      border: 1px solid #eadbcb;
    }
    .search-box i {
      color: #c48160;
    }
    .search-box input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 0.95rem;
      outline: none;
    }
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cat-btn {
      background: #ede3db;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 550;
      font-size: 0.85rem;
      color: #4d3428;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-btn.active {
      background: #c44b4b;
      color: white;
      box-shadow: 0 6px 12px -8px rgba(196, 75, 75, 0.4);
    }

    /* two columns layout: left menu grid, right ingredients panel */
    .split-layout {
      display: flex;
      gap: 1.8rem;
      flex-wrap: wrap;
    }
    .menu-section {
      flex: 2;
      min-width: 280px;
    }
    .ingredients-section {
      flex: 1.2;
      min-width: 260px;
      background: #fef9f4;
      border-radius: 32px;
      border: 1px solid #f3e2d4;
      padding: 1.2rem;
      height: fit-content;
      position: sticky;
      top: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
    }
    .ingredients-header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px dashed #e7cfc0;
      padding-bottom: 0.7rem;
      margin-bottom: 1rem;
    }
    .ingredients-header i {
      font-size: 1.6rem;
      color: #c9724c;
    }
    .ingredients-header h3 {
      font-weight: 700;
      color: #4a2c1e;
    }
    .ingredient-badge {
      background: #ffffff;
      border-radius: 60px;
      padding: 0.35rem 1rem;
      margin: 0.3rem 0.4rem;
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #794f38;
      border: 1px solid #f0dbcE;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .empty-ingredients {
      color: #b8886c;
      font-style: italic;
      padding: 1rem 0;
      text-align: center;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 0.5rem;
    }
    .menu-grid::-webkit-scrollbar {
      width: 6px;
    }
    .menu-grid::-webkit-scrollbar-track {
      background: #f2e3da;
      border-radius: 10px;
    }
    .menu-grid::-webkit-scrollbar-thumb {
      background: #c87a59;
      border-radius: 10px;
    }

    .menu-item-card {
      background: #ffffffea;
      border-radius: 28px;
      border: 1px solid #f5e2d4;
      padding: 0.75rem 1rem;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      cursor: pointer;
    }
    .menu-item-card.selected-for-ingredients {
      background: #fff3ea;
      border-left: 5px solid #c44b4b;
      box-shadow: 0 4px 12px rgba(196,75,75,0.1);
    }
    .item-details {
      flex: 3;
    }
    .item-name-id {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .item-name {
      font-weight: 680;
      font-size: 1rem;
      color: #2c221d;
    }
    .item-id-badge {
      background: #f1e3db;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 40px;
      color: #a75638;
      font-family: monospace;
    }
    .price-tag {
      font-weight: 700;
      color: #b35132;
      background: #fef0e8;
      display: inline-block;
      padding: 0.2rem 0.9rem;
      border-radius: 24px;
      font-size: 0.85rem;
    }
    .qty-module {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f2eae3;
      border-radius: 44px;
      padding: 0.2rem;
    }
    .qty-btn {
      background: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 34px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #ac4e2f;
      cursor: pointer;
      transition: 0.08s linear;
      border: 1px solid #fadbcb;
    }
    .qty-btn:hover:not(:disabled) {
      background: #ac4e2f;
      color: white;
    }
    .qty-number {
      min-width: 30px;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .summary-box {
      background: #fcf8f4;
      border-radius: 28px;
      padding: 1.2rem 1.5rem;
      border-left: 8px solid #d8997b;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.55;
      white-space: pre-line;
      margin-top: 1.5rem;
      border: 1px solid #ffdecb;
      max-height: 200px;
      overflow-y: auto;
    }
    .action-group {
      display: flex;
      gap: 1rem;
      margin: 1.2rem 0 0.8rem;
      flex-wrap: wrap;
    }
    .action-button {
      flex: 1;
      background: linear-gradient(115deg, #c44b4b, #e07c4c);
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.05rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
    }
    .cancel-btn {
      background: #f0e2da;
      color: #723b28;
    }
    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 10, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .loading-card {
      background: #fffcf7;
      padding: 2rem 2.5rem;
      border-radius: 70px;
      text-align: center;
    }
    .custom-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f1cdbc;
      border-top: 4px solid #c44b4b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      border-radius: 50px;
      background: #2b2b2b;
      color: white;
      font-weight: 500;
      z-index: 1100;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeSlide 0.2s ease;
    }
    .notification.success { background: #1f7a4d; }
    .notification.error { background: #b34238; }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateX(30px);}
      100% { opacity: 1; transform: translateX(0);}
    }
    .footer-note {
      text-align: right;
      font-size: 0.75rem;
      color: #a98974;
      margin-top: 0.4rem;
    }
    @media (max-width: 860px) {
      .split-layout { flex-direction: column; }
      .ingredients-section { position: static; width: 100%; }
      .order-card { padding: 1.2rem; }
      .user-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  </div>

      "Fish & Chips|Fish Fillet","Fish & Chips|Breadcrumbs","Fish & Chips|Potatoes","Fish & Chips|Oil","Fish & Chips|Tartar Sauce",
      "Shrimp Tempura|Shrimp","Shrimp Tempura|Tempura Flour","Shrimp Tempura|Egg","Shrimp Tempura|Ice Water","Shrimp Tempura|Oil","Shrimp Tempura|Sauce",
      "Pizza Margherita|Pizza Dough","Pizza Margherita|Tomato Sauce","Pizza Margherita|Mozzarella","Pizza Margherita|Basil","Pizza Margherita|Olive Oil",
      "Pepperoni Pizza|Pizza Dough","Pepperoni Pizza|Tomato Sauce","Pepperoni Pizza|Mozzarella","Pepperoni Pizza|Pepperoni",
      "Vegetable Pizza|Pizza Dough","Vegetable Pizza|Tomato Sauce","Vegetable Pizza|Mozzarella","Vegetable Pizza|Mushrooms","Vegetable Pizza|Bell Peppers","Vegetable Pizza|Onion","Vegetable Pizza|Olives",
      "Lasagna|Ground Beef","Lasagna|Tomato Sauce","Lasagna|Ricotta Cheese","Lasagna|Mozzarella","Lasagna|Parmesan","Lasagna|Lasagna Sheets",
      "Taco Plate|Corn Tortillas","Taco Plate|Ground Beef","Taco Plate|Lettuce","Taco Plate|Tomato","Taco Plate|Cheese","Taco Plate|Spicy Sauce",
      "Burrito|Wheat Tortilla","Burrito|Rice","Burrito|Beans","Burrito|Chicken","Burrito|Cheese","Burrito|Sauce",
      "Nachos|Tortilla Chips","Nachos|Melted Cheese","Nachos|Jalapenos","Nachos|Guacamole","Nachos|Sauce",
      "Fried Rice|Rice","Fried Rice|Egg","Fried Rice|Vegetables","Fried Rice|Soy Sauce","Fried Rice|Oil",
      "Chicken Curry|Chicken","Chicken Curry|Curry Sauce","Chicken Curry|Coconut Milk","Chicken Curry|Onion","Chicken Curry|Garlic","Chicken Curry|Ginger",
      "Beef Burger Plate|Ground Beef","Beef Burger Plate|Rice","Beef Burger Plate|Salad",
      "Veggie Plate|Rice","Veggie Plate|Falafel","Veggie Plate|Hummus","Veggie Plate|Salad","Veggie Plate|Grilled Vegetables",
      "Mixed Grill|Lamb","Mixed Grill|Chicken","Mixed Grill|Kofta","Mixed Grill|Rice","Mixed Grill|Grilled Vegetables",
      "Kebab Plate|Ground Lamb","Kebab Plate|Rice","Kebab Plate|Salad","Kebab Plate|Bread",
      "Sushi Set|Sushi Rice","Sushi Set|Raw Fish","Sushi Set|Nori","Sushi Set|Cucumber","Sushi Set|Avocado","Sushi Set|Soy Sauce",
      "Ramen Bowl|Noodles","Ramen Bowl|Chicken Broth","Ramen Bowl|Boiled Egg","Ramen Bowl|Vegetables","Ramen Bowl|Meat",
      "Pad Thai|Rice Noodles","Pad Thai|Shrimp","Pad Thai|Egg","Pad Thai|Peanuts","Pad Thai|Tamarind Sauce",
      "BBQ Ribs|Pork Ribs","BBQ Ribs|BBQ Sauce","BBQ Ribs|Potatoes","BBQ Ribs|Coleslaw",
      "Caesar Salad|Romaine Lettuce","Caesar Salad|Chicken Breast","Caesar Salad|Croutons","Caesar Salad|Parmesan Cheese","Caesar Salad|Caesar Dressing",
      "Greek Salad|Cucumber","Greek Salad|Tomato","Greek Salad|Bell Pepper","Greek Salad|Red Onion","Greek Salad|Olives","Greek Salad|Feta Cheese","Greek Salad|Olive Oil",
      "Coca Cola|Coca Cola","Pepsi|Pepsi","Sprite|Sprite","7 Up|7 Up","Fanta Orange|Fanta Orange","Fanta Lemon|Fanta Lemon","Mountain Dew|Mountain Dew","Dr Pepper|Dr Pepper","Root Beer|Root Beer","Iced Tea|Iced Tea","Lemonade|Lemonade","Water|Water","Red Bull|Red Bull","Monster|Monster","Ginger Ale|Ginger Ale","Soda Water|Soda Water","Apple Juice|Apple Juice","Orange Juice|Orange Juice","Tomato Juice|Tomato Juice","Mango Juice|Mango Juice"
    ];
    ingredientLines.forEach(line => {
      let [itemName, ingredient] = line.split("|");
      if (itemName && ingredient) {
        addIngredient(itemName.trim(), ingredient.trim());
      }
    });
    // For drinks without specific extra ingredients, ensure they have at least one ingredient (the drink itself)
    fullMenu.forEach(item => {
      if (item.category === "drinks" && (!ingredientsMap.has(item.name) || ingredientsMap.get(item.name).length === 0)) {
        ingredientsMap.set(item.name, [item.name]);
      }
    });

    let quantities = new Array(71).fill(0);
    let activeCategory = "all";
    let searchTerm = "";
    let selectedItemIdForIngredients = null; // track which item is clicked for ingredient view

    const menuGrid = document.getElementById("menu-grid-container");
    const summaryDiv = document.getElementById("order-summary");
    const nameInput = document.getElementById("customer-name");
    const phoneInput = document.getElementById("customer-phone");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const searchInput = document.getElementById("search-input");
    const ingredientsContainer = document.getElementById("ingredients-list-container");

    function renderIngredientsPanel(itemName) {
      const ingredients = ingredientsMap.get(itemName) || [];
      if (!ingredients.length) {
        ingredientsContainer.innerHTML = `<div class="empty-ingredients"><i class="fas fa-info-circle"></i> no detailed ingredients listed, but it's delicious!</div>`;
        return;
      }
      let html = `<div style="margin-bottom:0.5rem;"><i class="fas fa-clipboard-list"></i> <strong>${itemName}</strong> composition:</div><div>`;
      ingredients.forEach(ing => {
        html += `<span class="ingredient-badge"><i class="fas fa-seedling"></i> ${ing}</span>`;
      });
      html += `</div>`;
      ingredientsContainer.innerHTML = html;
    }

    function renderMenu() {
      let filtered = fullMenu.filter(item => {
        const matchesCategory = (activeCategory === "all") || (item.category === activeCategory);
        const matchesSearch = searchTerm === "" || item.name.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });
      menuGrid.innerHTML = "";
      if (filtered.length === 0) {
        menuGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem; color:#a86f52;">✨ no items match</div>`;
        return;
      }
      filtered.forEach(item => {
        const qty = quantities[item.id] || 0;
        const card = document.createElement("div");
        card.className = `menu-item-card ${selectedItemIdForIngredients === item.id ? 'selected-for-ingredients' : ''}`;
        const detailsDiv = document.createElement("div");
        detailsDiv.className = "item-details";
        const nameIdDiv = document.createElement("div");
        nameIdDiv.className = "item-name-id";
        const nameSpan = document.createElement("span");
        nameSpan.className = "item-name";
        nameSpan.innerText = item.name;
        const idBadge = document.createElement("span");
        idBadge.className = "item-id-badge";
        idBadge.innerText = `ID: ${item.id}`;
        nameIdDiv.appendChild(nameSpan);
        nameIdDiv.appendChild(idBadge);
        const priceSpan = document.createElement("span");
        priceSpan.className = "price-tag";
        priceSpan.innerText = `$${item.price}`;
        detailsDiv.appendChild(nameIdDiv);
        detailsDiv.appendChild(priceSpan);
        const qtyModule = document.createElement("div");
        qtyModule.className = "qty-module";
        const minusBtn = document.createElement("button");
        minusBtn.className = "qty-btn minus";
        minusBtn.innerText = "–";
        minusBtn.disabled = (qty === 0);
        const qtySpan = document.createElement("span");
        qtySpan.className = "qty-number";
        qtySpan.innerText = qty;
        const plusBtn = document.createElement("button");
        plusBtn.className = "qty-btn plus";
        plusBtn.innerText = "+";
        qtyModule.appendChild(minusBtn);
        qtyModule.appendChild(qtySpan);
        qtyModule.appendChild(plusBtn);
        card.appendChild(detailsDiv);
        card.appendChild(qtyModule);
        // click on card (but not on buttons) shows ingredients
        card.addEventListener("click", (e) => {
          if (e.target === minusBtn || e.target === plusBtn || e.target === qtySpan) return;
          selectedItemIdForIngredients = item.id;
          renderIngredientsPanel(item.name);
          renderMenu(); // re-render to highlight selected card
        });
        menuGrid.appendChild(card);
        plusBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          let newVal = quantities[item.id] + 1;
          quantities[item.id] = newVal;
          updateQtyUI(item.id, newVal);
          updateOrderSummary();
          validateSubmit();
        });
        minusBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (quantities[item.id] > 0) {
            let newVal = quantities[item.id] - 1;
            quantities[item.id] = newVal;
            updateQtyUI(item.id, newVal);
            updateOrderSummary();
            validateSubmit();
          }
        });
      });
    }

    function updateQtyUI(itemId, newQty) {
      const allCards = document.querySelectorAll(".menu-item-card");
      for (let card of allCards) {
        const idBadgeSpan = card.querySelector(".item-id-badge");
        if (idBadgeSpan && idBadgeSpan.innerText.includes(`ID: ${itemId}`)) {
          const qtySpan = card.querySelector(".qty-number");
          const minusBtn = card.querySelector(".minus");
          if (qtySpan) qtySpan.innerText = newQty;
          if (minusBtn) minusBtn.disabled = (newQty === 0);
          break;
        }
      }
    }

    function updateOrderSummary() {
      const customerName = nameInput.value.trim();
      const customerPhone = phoneInput.value.trim();
      let total = 0;
      let hasItems = false;
      let summaryText = "";
      if (customerName || customerPhone) summaryText += `👤 ${customerName || '?'}  ·  📞 ${customerPhone || '?'}\n\n`;
      summaryText += `▪️ your order ▪️\n`;
      for (let i = 1; i <= 70; i++) {
        const qty = quantities[i];
        if (qty > 0) {
          const item = fullMenu.find(m => m.id === i);
          if (item) {
            const subtotal = item.price * qty;
            summaryText += `  • ${item.name} (ID:${item.id}) x${qty}  = $${subtotal.toFixed(2)}\n`;
            total += subtotal;
            hasItems = true;
          }
        }
      }
      if (!hasItems) summaryText += `  (no items selected)\n`;
      summaryText += `\n└─ total  $${total.toFixed(2)}`;
      summaryDiv.innerText = summaryText;
    }

    function validateSubmit() {
      const nameOk = nameInput.value.trim() !== "";
      const phoneOk = phoneInput.value.trim() !== "";
      const hasAnyItem = quantities.some((q, idx) => idx >= 1 && q > 0);
      submitBtn.disabled = !(nameOk && phoneOk && hasAnyItem);
    }

    function resetAllFields() {
      nameInput.value = "";
      phoneInput.value = "";
      for (let i = 1; i <= 70; i++) quantities[i] = 0;
      selectedItemIdForIngredients = null;
      ingredientsContainer.innerHTML = `<div class="empty-ingredients"><i class="fas fa-hand-pointer"></i> click any item to see its real ingredients</div>`;
      renderMenu();
      updateOrderSummary();
      validateSubmit();
    }

    function showNotification(msg, type = "success") {
      const notif = document.createElement("div");
      notif.className = `notification ${type}`;
      notif.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    async function sendOrderToN8n(orderData) {
      const webhookUrl = 'https://alaeddineamamraee.app.n8n.cloud/webhook-test/65d971e0-13f4-44b6-9eaf-1e0fffb390f2';
      try {
        const resp = await fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        return { success: true, data };
      } catch (err) { console.error(err); return { success: false, error: err.message }; }
    }

    submitBtn.addEventListener("click", async function() {
      const customerName = nameInput.value.trim();
      const customerPhone = phoneInput.value.trim();
      if (!customerName || !customerPhone) { showNotification("name & phone required", "error"); return; }
      const orderItems = [];
      let total = 0;
      for (let i = 1; i <= 70; i++) {
        const qty = quantities[i];
        if (qty > 0) {
          const item = fullMenu.find(m => m.id === i);
          if (item) {
            const subtotal = item.price * qty;
            total += subtotal;
            orderItems.push({ id: item.id, name: item.name, quantity: qty, price: item.price, subtotal });
          }
        }
      }
      if (orderItems.length === 0) { showNotification("select at least one item", "error"); return; }
      const payload = { orderId: 'ORD-' + Date.now(), timestamp: new Date().toISOString(), customer: { name: customerName, phone: customerPhone }, items: orderItems, total: Number(total.toFixed(2)), summary: summaryDiv.innerText };
      loadingOverlay.style.display = "flex";
      submitBtn.disabled = true;
      cancelBtn.disabled = true;
      const result = await sendOrderToN8n(payload);
      loadingOverlay.style.display = "none";
      cancelBtn.disabled = false;
      if (result.success) {
        showNotification("✅ order placed successfully!", "success");
        for (let i = 1; i <= 70; i++) quantities[i] = 0;
        selectedItemIdForIngredients = null;
        ingredientsContainer.innerHTML = `<div class="empty-ingredients"><i class="fas fa-hand-pointer"></i> click any item to see its real ingredients</div>`;
        nameInput.value = ""; phoneInput.value = "";
        renderMenu();
        updateOrderSummary();
        validateSubmit();
      } else { showNotification("❌ sending failed, try again", "error"); submitBtn.disabled = false; validateSubmit(); }
    });

    cancelBtn.addEventListener("click", () => { resetAllFields(); showNotification("🧹 Order canceled", "success"); });
    searchInput.addEventListener("input", (e) => { searchTerm = e.target.value; renderMenu(); });
    const catBtns = document.querySelectorAll(".cat-btn");
    catBtns.forEach(btn => { btn.addEventListener("click", () => { catBtns.forEach(b => b.classList.remove("active")); btn.classList.add("active"); activeCategory = btn.dataset.cat; renderMenu(); }); });
    phoneInput.addEventListener("input", function() { this.value = this.value.replace(/\D/g, ''); validateSubmit(); updateOrderSummary(); });
    nameInput.addEventListener("input", () => { validateSubmit(); updateOrderSummary(); });
    renderMenu();
    updateOrderSummary();
    validateSubmit();
  })();
</script>
