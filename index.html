<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>flavor · order studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f7f3ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* main card */
    .order-card {
      max-width: 1280px;
      width: 100%;
      background: #ffffffec;
      backdrop-filter: blur(2px);
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
      padding: 2rem 1.8rem;
      border: 1px solid rgba(245, 222, 205, 0.7);
    }

    /* header & brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .brand h1 {
      font-size: 2.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c44b4b, #b95b3f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-right: auto;
      letter-spacing: -0.02em;
    }
    .brand span {
      background: #2b2b2b;
      color: #f9d77e;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* user fields */
    .user-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .input-field {
      background: #f9f6f2;
      border: 1.5px solid #eee2d8;
      border-radius: 34px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    .input-field:focus {
      border-color: #d17a4b;
      background: white;
    }

    /* search & filter bar */
    .search-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
      background: #fefaf6;
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #f0e1d4;
    }
    .search-box {
      flex: 2;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border-radius: 44px;
      padding: 0.5rem 1rem;
      border: 1px solid #eadbcb;
    }
    .search-box i {
      color: #c48160;
      font-size: 1.1rem;
    }
    .search-box input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 0.95rem;
      outline: none;
    }
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: transparent;
    }
    .cat-btn {
      background: #ede3db;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 550;
      font-size: 0.85rem;
      color: #4d3428;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-btn.active {
      background: #c44b4b;
      color: white;
      box-shadow: 0 6px 12px -8px rgba(196, 75, 75, 0.4);
    }
    .cat-btn i {
      font-size: 0.9rem;
    }

    /* menu grid — modern, compact, easy to scroll */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 1.2rem;
      border-radius: 28px;
    }
    .menu-grid::-webkit-scrollbar {
      width: 6px;
    }
    .menu-grid::-webkit-scrollbar-track {
      background: #f2e3da;
      border-radius: 10px;
    }
    .menu-grid::-webkit-scrollbar-thumb {
      background: #c87a59;
      border-radius: 10px;
    }

    /* item card */
    .menu-item-card {
      background: #ffffffea;
      border-radius: 28px;
      border: 1px solid #f5e2d4;
      padding: 0.75rem 1rem;
      transition: 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      backdrop-filter: blur(2px);
    }
    .item-details {
      flex: 3;
    }
    .item-name-id {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .item-name {
      font-weight: 680;
      font-size: 1rem;
      color: #2c221d;
    }
    .item-id-badge {
      background: #f1e3db;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 40px;
      color: #a75638;
      font-family: monospace;
    }
    .price-tag {
      font-weight: 700;
      color: #b35132;
      background: #fef0e8;
      display: inline-block;
      padding: 0.2rem 0.9rem;
      border-radius: 24px;
      font-size: 0.85rem;
    }
    .qty-module {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f2eae3;
      border-radius: 44px;
      padding: 0.2rem;
    }
    .qty-btn {
      background: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 34px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #ac4e2f;
      cursor: pointer;
      transition: 0.08s linear;
      border: 1px solid #fadbcb;
    }
    .qty-btn:hover:not(:disabled) {
      background: #ac4e2f;
      color: white;
    }
    .qty-number {
      min-width: 30px;
      text-align: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* summary + actions */
    .summary-box {
      background: #fcf8f4;
      border-radius: 28px;
      padding: 1.2rem 1.5rem;
      border-left: 8px solid #d8997b;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.55;
      white-space: pre-line;
      margin-top: 1.5rem;
      border: 1px solid #ffdecb;
      max-height: 210px;
      overflow-y: auto;
    }
    .action-group {
      display: flex;
      gap: 1rem;
      margin: 1.5rem 0 0.8rem;
      flex-wrap: wrap;
    }
    .action-button {
      flex: 1;
      background: linear-gradient(115deg, #c44b4b, #e07c4c);
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.05rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
    }
    .cancel-btn {
      background: #f0e2da;
      color: #723b28;
    }
    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 10, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .loading-card {
      background: #fffcf7;
      padding: 2rem 2.5rem;
      border-radius: 70px;
      text-align: center;
    }
    .custom-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f1cdbc;
      border-top: 4px solid #c44b4b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      border-radius: 50px;
      background: #2b2b2b;
      color: white;
      font-weight: 500;
      z-index: 1100;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeSlide 0.2s ease;
    }
    .notification.success { background: #1f7a4d; }
    .notification.error { background: #b34238; }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateX(30px);}
      100% { opacity: 1; transform: translateX(0);}
    }
    .footer-note {
      text-align: right;
      font-size: 0.75rem;
      color: #a98974;
      margin-top: 0.4rem;
    }
    @media (max-width: 680px) {
      .order-card { padding: 1.2rem; }
      .user-grid { grid-template-columns: 1fr; }
      .menu-grid { max-height: 420px; }
    }
  </style>
</head>
<body>
<div class="order-card">
  <div class="brand">
    <h1><i class="fas fa-utensils"></i> flavor</h1>
    <span><i class="far fa-clock"></i> 30‑40 min</span>
  </div>

  <div class="user-grid">
    <input type="text" id="customer-name" class="input-field" placeholder="your name *" autocomplete="off">
    <input type="tel" id="customer-phone" class="input-field" placeholder="phone number *" autocomplete="off">
  </div>

  <!-- improved search + category filter -->
  <div class="search-filter-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="search burger, pizza, juice...">
    </div>
    <div class="category-tabs" id="category-tabs">
      <button class="cat-btn active" data-cat="all"><i class="fas fa-grid-2"></i> All</button>
      <button class="cat-btn" data-cat="sandwiches"><i class="fas fa-burger"></i> Sandwiches</button>
      <button class="cat-btn" data-cat="drinks"><i class="fas fa-wine-bottle"></i> Drinks</button>
      <button class="cat-btn" data-cat="dishes"><i class="fas fa-utensil-spoon"></i> Main dishes</button>
    </div>
  </div>

  <!-- dynamic menu container (grid) -->
  <div id="menu-grid-container" class="menu-grid"></div>

  <div class="action-group">
    <button class="action-button" id="submit-btn" disabled><i class="fas fa-paper-plane"></i> submit order</button>
    <button class="action-button cancel-btn" id="cancel-btn"><i class="fas fa-trash-alt"></i> cancel order</button>
  </div>
  <div id="order-summary" class="summary-box"></div>
  <div class="footer-note"><i class="fas fa-leaf"></i> each item has unique ID & fresh ingredients</div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card"><div class="custom-spinner"></div><p><i class="fas fa-mug-hot"></i> cooking order ...</p></div>
</div>

<script>
  (function() {
    // ---------- MASTER DATASET with ID (1-70) exactly as provided ----------
    const fullMenu = [
      { id:1, name:"Burger", price:5, category:"sandwiches" }, { id:2, name:"Cheese Burger", price:6, category:"sandwiches" },
      { id:3, name:"Chicken Burger", price:6, category:"sandwiches" }, { id:4, name:"Double Burger", price:8, category:"sandwiches" },
      { id:5, name:"Veggie Burger", price:5, category:"sandwiches" }, { id:6, name:"Fish Sandwich", price:6, category:"sandwiches" },
      { id:7, name:"Grilled Chicken Sandwich", price:7, category:"sandwiches" }, { id:8, name:"Spicy Chicken Sandwich", price:7, category:"sandwiches" },
      { id:9, name:"Bacon Burger", price:7, category:"sandwiches" }, { id:10, name:"Mushroom Burger", price:6, category:"sandwiches" },
      { id:11, name:"BBQ Burger", price:8, category:"sandwiches" }, { id:12, name:"Tuna Sandwich", price:6, category:"sandwiches" },
      { id:13, name:"Egg Sandwich", price:4, category:"sandwiches" }, { id:14, name:"Club Sandwich", price:7, category:"sandwiches" },
      { id:15, name:"Ham Sandwich", price:6, category:"sandwiches" }, { id:16, name:"Salami Sandwich", price:6, category:"sandwiches" },
      { id:17, name:"Turkey Sandwich", price:7, category:"sandwiches" }, { id:18, name:"BLT Sandwich", price:6, category:"sandwiches" },
      { id:19, name:"Cheesesteak Sandwich", price:8, category:"sandwiches" }, { id:20, name:"Pulled Pork Sandwich", price:8, category:"sandwiches" },
      { id:21, name:"Chicken Nuggets", price:5, category:"dishes" }, { id:22, name:"French Fries", price:3, category:"dishes" },
      { id:23, name:"Mozzarella Sticks", price:4, category:"dishes" }, { id:24, name:"Chicken Wings", price:6, category:"dishes" },
      { id:25, name:"Grilled Chicken", price:8, category:"dishes" }, { id:26, name:"Beef Steak", price:10, category:"dishes" },
      { id:27, name:"Pasta Bolognese", price:7, category:"dishes" }, { id:28, name:"Spaghetti Carbonara", price:7, category:"dishes" },
      { id:29, name:"Salmon Fillet", price:9, category:"dishes" }, { id:30, name:"Fish & Chips", price:8, category:"dishes" },
      { id:31, name:"Shrimp Tempura", price:9, category:"dishes" }, { id:32, name:"Pizza Margherita", price:6, category:"dishes" },
      { id:33, name:"Pepperoni Pizza", price:7, category:"dishes" }, { id:34, name:"Vegetable Pizza", price:6, category:"dishes" },
      { id:35, name:"Lasagna", price:7, category:"dishes" }, { id:36, name:"Taco Plate", price:6, category:"dishes" },
      { id:37, name:"Burrito", price:7, category:"dishes" }, { id:38, name:"Nachos", price:5, category:"dishes" },
      { id:39, name:"Fried Rice", price:6, category:"dishes" }, { id:40, name:"Chicken Curry", price:7, category:"dishes" },
      { id:41, name:"Beef Burger Plate", price:8, category:"dishes" }, { id:42, name:"Veggie Plate", price:7, category:"dishes" },
      { id:43, name:"Mixed Grill", price:12, category:"dishes" }, { id:44, name:"Kebab Plate", price:10, category:"dishes" },
      { id:45, name:"Sushi Set", price:12, category:"dishes" }, { id:46, name:"Ramen Bowl", price:9, category:"dishes" },
      { id:47, name:"Pad Thai", price:8, category:"dishes" }, { id:48, name:"BBQ Ribs", price:12, category:"dishes" },
      { id:49, name:"Caesar Salad", price:5, category:"dishes" }, { id:50, name:"Greek Salad", price:5, category:"dishes" },
      { id:51, name:"Coca Cola", price:2, category:"drinks" }, { id:52, name:"Pepsi", price:2, category:"drinks" },
      { id:53, name:"Sprite", price:2, category:"drinks" }, { id:54, name:"7 Up", price:2, category:"drinks" },
      { id:55, name:"Fanta Orange", price:2, category:"drinks" }, { id:56, name:"Fanta Lemon", price:2, category:"drinks" },
      { id:57, name:"Mountain Dew", price:3, category:"drinks" }, { id:58, name:"Dr Pepper", price:3, category:"drinks" },
      { id:59, name:"Root Beer", price:3, category:"drinks" }, { id:60, name:"Iced Tea", price:2, category:"drinks" },
      { id:61, name:"Lemonade", price:2, category:"drinks" }, { id:62, name:"Water", price:1, category:"drinks" },
      { id:63, name:"Red Bull", price:4, category:"drinks" }, { id:64, name:"Monster", price:4, category:"drinks" },
      { id:65, name:"Ginger Ale", price:2, category:"drinks" }, { id:66, name:"Soda Water", price:1, category:"drinks" },
      { id:67, name:"Apple Juice", price:2, category:"drinks" }, { id:68, name:"Orange Juice", price:2, category:"drinks" },
      { id:69, name:"Tomato Juice", price:2, category:"drinks" }, { id:70, name:"Mango Juice", price:3, category:"drinks" }
    ];

    // store state: quantities keyed by item ID
    let quantities = new Array(71).fill(0);  // index 1..70
    let activeCategory = "all";
    let searchTerm = "";

    const menuGrid = document.getElementById("menu-grid-container");
    const summaryDiv = document.getElementById("order-summary");
    const nameInput = document.getElementById("customer-name");
    const phoneInput = document.getElementById("customer-phone");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const searchInput = document.getElementById("search-input");

    // helper: render menu items based on filters (category + search)
    function renderMenu() {
      if (!menuGrid) return;
      let filtered = fullMenu.filter(item => {
        const matchesCategory = (activeCategory === "all") || (item.category === activeCategory);
        const matchesSearch = searchTerm === "" || item.name.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      menuGrid.innerHTML = "";
      if (filtered.length === 0) {
        menuGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem; color:#a86f52;">✨ no items match</div>`;
        return;
      }

      filtered.forEach(item => {
        const qty = quantities[item.id] || 0;
        const card = document.createElement("div");
        card.className = "menu-item-card";

        const detailsDiv = document.createElement("div");
        detailsDiv.className = "item-details";
        const nameIdDiv = document.createElement("div");
        nameIdDiv.className = "item-name-id";
        const nameSpan = document.createElement("span");
        nameSpan.className = "item-name";
        nameSpan.innerText = item.name;
        const idBadge = document.createElement("span");
        idBadge.className = "item-id-badge";
        idBadge.innerText = `ID: ${item.id}`;
        nameIdDiv.appendChild(nameSpan);
        nameIdDiv.appendChild(idBadge);
        const priceSpan = document.createElement("span");
        priceSpan.className = "price-tag";
        priceSpan.innerText = `$${item.price}`;
        detailsDiv.appendChild(nameIdDiv);
        detailsDiv.appendChild(priceSpan);

        const qtyModule = document.createElement("div");
        qtyModule.className = "qty-module";
        qtyModule.dataset.id = item.id;
        const minusBtn = document.createElement("button");
        minusBtn.className = "qty-btn minus";
        minusBtn.innerText = "–";
        minusBtn.disabled = (qty === 0);
        const qtySpan = document.createElement("span");
        qtySpan.className = "qty-number";
        qtySpan.innerText = qty;
        const plusBtn = document.createElement("button");
        plusBtn.className = "qty-btn plus";
        plusBtn.innerText = "+";

        qtyModule.appendChild(minusBtn);
        qtyModule.appendChild(qtySpan);
        qtyModule.appendChild(plusBtn);
        card.appendChild(detailsDiv);
        card.appendChild(qtyModule);
        menuGrid.appendChild(card);

        // event handlers for quantity
        plusBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          let newVal = quantities[item.id] + 1;
          quantities[item.id] = newVal;
          updateQtyUI(item.id, newVal);
          updateOrderSummary();
          validateSubmit();
        });
        minusBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (quantities[item.id] > 0) {
            let newVal = quantities[item.id] - 1;
            quantities[item.id] = newVal;
            updateQtyUI(item.id, newVal);
            updateOrderSummary();
            validateSubmit();
          }
        });
      });
    }

    function updateQtyUI(itemId, newQty) {
      // refresh only the specific item cards inside grid
      const allCards = document.querySelectorAll(".menu-item-card");
      for (let card of allCards) {
        const idBadgeSpan = card.querySelector(".item-id-badge");
        if (idBadgeSpan && idBadgeSpan.innerText.includes(`ID: ${itemId}`)) {
          const qtySpan = card.querySelector(".qty-number");
          const minusBtn = card.querySelector(".minus");
          if (qtySpan) qtySpan.innerText = newQty;
          if (minusBtn) minusBtn.disabled = (newQty === 0);
          break;
        }
      }
    }

    // update summary (preserve logic, include IDs in payload)
    function updateOrderSummary() {
      const customerName = nameInput.value.trim();
      const customerPhone = phoneInput.value.trim();
      let total = 0;
      let hasItems = false;
      let summaryText = "";

      if (customerName || customerPhone) {
        summaryText += `👤 ${customerName || '?'}  ·  📞 ${customerPhone || '?'}\n\n`;
      }
      summaryText += `▪️ your order ▪️\n`;

      for (let i = 1; i <= 70; i++) {
        const qty = quantities[i];
        if (qty > 0) {
          const item = fullMenu.find(m => m.id === i);
          if (item) {
            const subtotal = item.price * qty;
            summaryText += `  • ${item.name} (ID:${item.id}) x${qty}  = $${subtotal.toFixed(2)}\n`;
            total += subtotal;
            hasItems = true;
          }
        }
      }
      if (!hasItems) summaryText += `  (no items selected)\n`;
      summaryText += `\n└─ total  $${total.toFixed(2)}`;
      summaryDiv.innerText = summaryText;
    }

    function validateSubmit() {
      const nameOk = nameInput.value.trim() !== "";
      const phoneOk = phoneInput.value.trim() !== "";
      const hasAnyItem = quantities.some((q, idx) => idx >= 1 && q > 0);
      submitBtn.disabled = !(nameOk && phoneOk && hasAnyItem);
    }

    // reset all fields & quantities
    function resetAllFields() {
      nameInput.value = "";
      phoneInput.value = "";
      for (let i = 1; i <= 70; i++) quantities[i] = 0;
      // re-render menu to update all UI buttons + qty displays
      renderMenu();        // full refresh resets all quantities visually
      updateOrderSummary();
      validateSubmit();
    }

    // notification helper
    function showNotification(msg, type = "success") {
      const notif = document.createElement("div");
      notif.className = `notification ${type}`;
      notif.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${msg}`;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    // send to n8n
    async function sendOrderToN8n(orderData) {
      const webhookUrl = 'https://alaeddineamamraee.app.n8n.cloud/webhook-test/65d971e0-13f4-44b6-9eaf-1e0fffb390f2';
      try {
        const resp = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        return { success: true, data };
      } catch (err) {
        console.error(err);
        return { success: false, error: err.message };
      }
    }

    // submit handler: exactly same logic but with id-enriched items
    submitBtn.addEventListener("click", async function() {
      const customerName = nameInput.value.trim();
      const customerPhone = phoneInput.value.trim();
      if (!customerName || !customerPhone) {
        showNotification("name & phone required", "error");
        return;
      }
      const orderItems = [];
      let total = 0;
      for (let i = 1; i <= 70; i++) {
        const qty = quantities[i];
        if (qty > 0) {
          const item = fullMenu.find(m => m.id === i);
          if (item) {
            const subtotal = item.price * qty;
            total += subtotal;
            orderItems.push({
              id: item.id,
              name: item.name,
              quantity: qty,
              price: item.price,
              subtotal: subtotal
            });
          }
        }
      }
      if (orderItems.length === 0) {
        showNotification("select at least one item", "error");
        return;
      }
      const currentSummary = summaryDiv.innerText;
      const payload = {
        orderId: 'ORD-' + Date.now(),
        timestamp: new Date().toISOString(),
        customer: { name: customerName, phone: customerPhone },
        items: orderItems,
        total: Number(total.toFixed(2)),
        summary: currentSummary
      };

      loadingOverlay.style.display = "flex";
      submitBtn.disabled = true;
      cancelBtn.disabled = true;

      const result = await sendOrderToN8n(payload);
      loadingOverlay.style.display = "none";
      cancelBtn.disabled = false;

      if (result.success) {
        showNotification("✅ order placed successfully!", "success");
        // reset after success: clear name, phone, quantities
        nameInput.value = "";
        phoneInput.value = "";
        for (let i = 1; i <= 70; i++) quantities[i] = 0;
        renderMenu();         // fresh UI
        updateOrderSummary();
        validateSubmit();
      } else {
        showNotification("❌ sending failed, try again", "error");
        submitBtn.disabled = false;
        validateSubmit();
      }
    });

    // cancel button: reset all fields, quantities, summary
    cancelBtn.addEventListener("click", function() {
      resetAllFields();
      showNotification("🧹 Order canceled", "success");
    });

    // search + category filters
    function applyFiltersAndRender() {
      renderMenu();
    }

    searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value;
      applyFiltersAndRender();
    });

    // category tab logic
    const catBtns = document.querySelectorAll(".cat-btn");
    catBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        catBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        applyFiltersAndRender();
      });
    });

    // phone number sanitize + validate
    phoneInput.addEventListener("input", function() {
      this.value = this.value.replace(/\D/g, '');
      validateSubmit();
      updateOrderSummary();
    });
    nameInput.addEventListener("input", () => {
      validateSubmit();
      updateOrderSummary();
    });

    // init: full render & summary
    renderMenu();
    updateOrderSummary();
    validateSubmit();
  })();
</script>
</body>
</html>
